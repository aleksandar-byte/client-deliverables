GHT STUDY</text><text x="1060" y="450.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">The existing roof is too low for a usable</text><text x="1060" y="476.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">office above the bedroom. The dashed</text><text x="1060" y="502.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">zone needs a raised sloping roof.</text><text x="1060" y="528.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a"></text><text x="1060" y="554.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">Working office floor: +2.85 m.</text><text x="1060" y="580.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">Roof and minimum standing height</text><text x="1060" y="606.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">need a section check before 3D.</text><text x="1060" y="700.0" text-anchor="start" font-size="23" font-weight="700" fill="#253d3a">IMPORTANT TRADE-OFFS</text><text x="1060" y="745.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">• The office stair replaces the island.</text><text x="1060" y="771.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">• The dining table remains.</text><text x="1060" y="797.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">• The upper landing adds area.</text><text x="1060" y="823.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">• Two separate stair connections are shown;</text><text x="1060" y="849.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">  they cannot be stacked with the basement</text><text x="1060" y="875.0" text-anchor="start" font-size="20" font-weight="400" fill="#253d3a">  on this corrected left-hand side.</text><text x="1060" y="985.0" text-anchor="start" font-size="23" font-weight="700" fill="#253d3a">AREA / BUDGET</text><text x="1060" y="1030.0" text-anchor="start" font-size="19" font-weight="400" fill="#253d3a">Existing main-level estimate: 150.1 m².</text><text x="1060" y="1054.7" text-anchor="start" font-size="19" font-weight="400" fill="#253d3a">Office: 15.3 m² clear, plus walls / access.</text><text x="1060" y="1079.4" text-anchor="start" font-size="19" font-weight="400" fill="#253d3a">Basement: 28.4 m² clear, plus walls.</text><text x="1060" y="1104.1" text-anchor="start" font-size="19" font-weight="400" fill="#253d3a">These use different area definitions;</text><text x="1060" y="1128.8" text-anchor="start" font-size="19" font-weight="400" fill="#253d3a">a certified total has not been calculated.</text><text x="80" y="1310.0" text-anchor="start" font-size="18" font-weight="400" fill="#253d3a">DRAFT FOR REVIEW  •  Green = office / roof change  •  Amber = stairs and upper access  •  Grey = existing floor below</text><text x="80" y="1347.0" text-anchor="start" font-size="18" font-weight="400" fill="#253d3a">Review the arrangement before the 3D rebuild. Roof shape, structural spans, stair headroom and local approvals remain unresolved.</text></g></svg>