<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><g font-family="Arial,sans-serif"><rect x="0" y="0" width="1400" height="1000" fill="#f7f5ed" stroke="none"/><text x="55" y="55.0" font-size="30" fill="#203f3c" font-weight="650">01 / One continuous pitched roof</text><text x="55" y="91.0" font-size="17" fill="#203f3c" font-weight="400">Proposed roof form · office inside the roof volume · no raised box or dormer</text><line x1="55" y1="115" x2="1345" y2="115" stroke="#bec9bd" stroke-width="2" stroke-dasharray=""/><polygon points="260.0,700 1070.0,700 1070.0,460.0 665.0,227.5 260.0,460.0" fill="#e3e6db" stroke="#23433f" stroke-width="2"/><polygon points="222.5,481.52777777777777 665.0,227.5 1107.5,481.5277777777778 1107.5,459.0277777777778 665.0,205.0 222.5,459.0277777777778" fill="#425d58" stroke="#23433f" stroke-width="2"/><polygon points="492.5,486.25 837.5,486.25 837.5,326.52777777777777 665.0,227.5 492.5,326.52777777777777" fill="#b9d2c1" stroke="none" stroke-width="2"/><line x1="492.5" y1="486.25" x2="837.5" y2="486.25" stroke="#244b46" stroke-width="6" stroke-dasharray=""/><line x1="260.0" y1="486.25" x2="1070.0" y2="486.25" stroke="#798b83" stroke-width="1" stroke-dasharray="8 5"/><text x="504.5" y="385.0" font-size="24" fill="#203f3c" font-weight="650">OFFICE</text><text x="504.5" y="418.75" font-size="20" fill="#203f3c" font-weight="400">15.18 m² clear</text><text x="75" y="190.0" font-size="19" fill="#203f3c" font-weight="400">Ridge ≈ +6.60 m outside</text><text x="75" y="215.65" font-size="19" fill="#203f3c" font-weight="400">+6.30 m to roof underside</text><line x1="315" y1="195" x2="665.0" y2="205.0" stroke="#7a8b7e" stroke-width="1" stroke-dasharray=""/><text x="1060" y="365.0" font-size="18" fill="#203f3c" font-weight="400">≈ 30° pitch</text><text x="1060" y="389.3" font-size="18" fill="#203f3c" font-weight="400">Both roof slopes</text><text x="1120" y="535.0" font-size="18" fill="#203f3c" font-weight="400">Eave underside</text><text x="1120" y="559.3" font-size="18" fill="#203f3c" font-weight="400">+3.20 m</text><line x1="1110" y1="520" x2="1070.0" y2="460.0" stroke="#7a8b7e" stroke-width="1" stroke-dasharray=""/><text x="75" y="745.0" font-size="17" fill="#203f3c" font-weight="650">EAST / VIEW SIDE</text><text x="1010" y="745.0" font-size="17" fill="#203f3c" font-weight="650">WEST / ENTRY SIDE</text><line x1="260.0" y1="760" x2="1070.0" y2="760" stroke="#23433f" stroke-width="2" stroke-dasharray=""/><text x="485.0" y="790.0" font-size="20" fill="#203f3c" font-weight="400">10.80 m between wall lines</text><text x="65" y="850.0" font-size="21" fill="#203f3c" font-weight="650">The ridge runs along the house; both roof slopes are redesigned.</text><text x="65" y="888.0" font-size="18" fill="#203f3c" font-weight="400">The office moves toward the ridge, above parts of the living / circulation / utility zone.</text><text x="65" y="912.3" font-size="18" fill="#203f3c" font-weight="400">Rooflights provide daylight; an east-facing rooflight gives an angled view, not a panoramic vertical window.</text><text x="65" y="936.6" font-size="18" fill="#203f3c" font-weight="400">Roof depth 0.30 m is an allowance. Final structure, insulation and ridge height need local design.</text></g></svg>