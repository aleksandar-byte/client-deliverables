ll="#203f3c" font-weight="400">No door swing over stair</text><line x1="875" y1="405" x2="386.2" y2="439.79999999999995" stroke="#6e8376" stroke-width="1" stroke-dasharray=""/><text x="890" y="500.0" font-size="18" fill="#a74034" font-weight="400">RED: proposed guarding</text><text x="890" y="524.3" font-size="18" fill="#a74034" font-weight="400">Upper landing closes unused</text><text x="890" y="548.6" font-size="18" fill="#a74034" font-weight="400">edge above the lower flight.</text><text x="90.39999999999999" y="198.39999999999998" font-size="16" fill="#203f3c" font-weight="400">LOW EAVES</text><text x="613.9999999999999" y="198.39999999999998" font-size="16" fill="#203f3c" font-weight="400">LOW EAVES</text><text x="65" y="700.0" font-size="19" fill="#203f3c" font-weight="650">*Headroom to proposed finished roof underside: ≈ 2.13 m at office side walls; 3.45 m at ridge.</text><text x="65" y="738.0" font-size="18" fill="#203f3c" font-weight="400">Green shows headroom at upper-floor level. The stair flights rise through the lower roof zone.</text><text x="65" y="762.3" font-size="18" fill="#203f3c" font-weight="400">Only the office, landing and stair core are proposed upper accommodation; low eaves are not counted.</text><text x="65" y="786.6" font-size="18" fill="#203f3c" font-weight="400">The office is reached through the high central roof zone. Enclosure / door fire specification remains to be designed.</text><text x="65" y="850.0" font-size="23" fill="#203f3c" font-weight="650">Basement revision</text><text x="65" y="885.0" font-size="18" fill="#203f3c" font-weight="400">Proposed rectangle: 8.60 × 3.75 m = 32.25 m² outside; 26.33 m² inside 250 mm walls.</text><text x="65" y="909.3" font-size="18" fill="#203f3c" font-weight="400">About 17.19 m² lies outside the stair-core envelope, before storage/circulation.</text><text x="65" y="933.6" font-size="18" fill="#203f3c" font-weight="400">About 11.25 m² of the deck now overlaps the basement roof. This is a proposal, not a verified foundation design.</text></g></svg>