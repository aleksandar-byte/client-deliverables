<!doctype html><html lang="mk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Скали во дневната — 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3eb;color:#254139;font:16px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:14px}h1{font-size:24px;margin:0 0 8px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{padding:10px 14px;border:1px solid #a9bba8;border-radius:5px;background:white;color:inherit;font:inherit;cursor:pointer}button.active{background:#315c4b;color:white}#view{height:72vh;min-height:430px;position:relative;overflow:hidden;border-radius:8px;background:#e7e9df}canvas{display:block;touch-action:none}.tag{position:absolute;transform:translate(-50%,-50%);background:#fffbeaeb;border:1px solid #c4c5b5;border-radius:4px;padding:4px 7px;font-size:13px;pointer-events:none;white-space:nowrap}p{margin:8px 0}small{color:#5b6c61}a{color:#286659}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"}}</script><main><h1>Скалите во дневната соба — 3D</h1><nav><button data-v="overview" class="active">Целиот дел</button><button data-v="living">Од дневната</button><button data-v="stairs">Поблиску до скалите</button><button data-v="section">Скали до подрумот</button></nav><div id="view"></div><p id="status">Се вчитува…</p><small>Влечи за вртење · со два прста зумирај. Покривот и дел од ѕидовите се скриени за да се гледа внатре. Портокалово = скали. Ова е издвоен приказ на положбата; новиот покрив не е прикажан.</small><p><a href="Roof_Office_Concept_Review.html">Предлог за канцеларијата под покрив</a></p></main><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const view=document.querySelector('#view'),scene=new T.Scene();scene.background=new T.Color('#e7e9df');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.localClippingEnabled=true;view.append(renderer.domElement);const camera=new T.PerspectiveCamera(45,1,.05,100),orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.maxPolarAngle=Math.PI*.49;orbit.minDistance=2;orbit.maxDistance=25;scene.add(new T.HemisphereLight(0xffffff,0xb7ae97,2.3));const sun=new T.DirectionalLight(0xfff6e7,2);sun.position.set(10,15,5);scene.add(sun);let root,mode='overview';const tags=[];

function apply(){if(!root)return;root.traverse(o=>{if(!o.isMesh)return;const k=o.userData.kind,b=new T.Box3().setFromObject(o),x=(b.min.x+b.max.x)/2,y=-(b.min.z+b.max.z)/2,isStair=k==='stair'||k==='rail';let visible=x>=2.05&&x<=7.85&&y>=-1.1&&y<=9.15&&k!=='roof';if(o.userData.floor==='office'||(!isStair&&b.min.y>2.3))visible=false;if(b.max.y<-.21&&mode!=='section')visible=false;if(mode==='section'&&!isStair&&!o.name.startsWith('Basement'))visible=false;if(mode==='section'&&k==='wall')visible=false;o.visible=visible;for(const m of Array.isArray(o.material)?o.material:[o.material])m.clippingPlanes=k==='wall'||k==='window'||k==='trim'?[new T.Plane(new T.Vector3(0,-1,0),mode==='living'?2.5:1.1)]:[];});const [p,t]=views[mode];camera.position.set(...p);orbit.target.set(...t);orbit.update();document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===mode));document.querySelector('#status').textContent=mode==='section'?'Истите скали се наредени вертикално: подрум → дневна → канцеларија.':'Се влегува од дневната, на подестот покрај ТВ-ѕидот.';}

for(const b of document.querySelectorAll('button'))b.onclick=()=>{mode=b.dataset.v;apply();};renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera);for(const t of tags){const p=t.p.clone().project(camera);t.el.hidden=mode==='section'&& !['СКАЛИ','ПОДРУМ','КАНЦЕЛАРИЈА','ДНЕВНА / ПОДЕСТ'].includes(t.text)||mode!=='section'&&['ПОДРУМ','КАНЦЕЛАРИЈА','ДНЕВНА / ПОДЕСТ'].includes(t.text)||Math.abs(p.x)>1||Math.abs(p.y)>1||p.z>1;t.el.style.left=(p.x+1)*view.clientWidth/2+'px';t.el.style.top=(1-p.y)*view.clientHeight/2+'px';}});
